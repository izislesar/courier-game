; Courier 404 scalability contract (docs/architecture/performance-budget.md).
; Low is a supported art target: complete visual path, no Lumen/Nanite/VSM dependency.
; Only cvars with ECVF_Scalability may appear here; project-wide renderer policy lives in DefaultEngine.ini.

[/Script/Scalability.ScalabilitySettings]
FrameTimeCap=33.333

[ResolutionQuality]
; Maps directly to r.ScreenPercentage per level (0/1/2/3).
0=75
1=90
2=100
3=100

[AntiAliasingQuality@0]
r.TSR.History.ScreenPercentage=50

[AntiAliasingQuality@1]
r.TSR.History.ScreenPercentage=100

[AntiAliasingQuality@2]
r.TSR.History.ScreenPercentage=100

[AntiAliasingQuality@3]
r.TSR.History.ScreenPercentage=200

[ViewDistanceQuality@0]
r.ViewDistanceScale=0.6

[ViewDistanceQuality@1]
r.ViewDistanceScale=0.8

[ViewDistanceQuality@2]
r.ViewDistanceScale=1.0

[ViewDistanceQuality@3]
r.ViewDistanceScale=1.5

; Conventional shadow maps only (VSM disabled project-wide).
[ShadowQuality@0]
r.Shadow.MaxCSMResolution=1024
r.Shadow.DistanceScale=0.7

[ShadowQuality@1]
r.Shadow.MaxCSMResolution=2048
r.Shadow.DistanceScale=1.0

[ShadowQuality@2]
r.Shadow.MaxCSMResolution=2048
r.Shadow.DistanceScale=1.0

[ShadowQuality@3]
r.Shadow.MaxCSMResolution=2048
r.Shadow.DistanceScale=1.25

; No dynamic GI at any preset: baked/static lighting + skylight + SSAO.
; Lumen remains a future measured-profiling option only (jev.23 discipline).
[GlobalIlluminationQuality@0]
r.AOQuality=1
r.DistanceFieldAO=0
r.SkylightIntensityMultiplier=0.9

[GlobalIlluminationQuality@1]
r.AOQuality=1
r.DistanceFieldAO=0
r.SkylightIntensityMultiplier=1.0

[GlobalIlluminationQuality@2]
r.AOQuality=1
r.DistanceFieldAO=0
r.SkylightIntensityMultiplier=1.0

[GlobalIlluminationQuality@3]
r.AOQuality=1
r.DistanceFieldAO=0
r.SkylightIntensityMultiplier=1.0

; Screen-space reflections + reflection captures only; no Lumen reflections.
[ReflectionQuality@0]
r.SSR.Quality=1
r.SSR.HalfResSceneColor=1

[ReflectionQuality@1]
r.SSR.Quality=3
r.SSR.HalfResSceneColor=1

[ReflectionQuality@2]
r.SSR.Quality=4
r.SSR.HalfResSceneColor=0

[ReflectionQuality@3]
r.SSR.Quality=4
r.SSR.HalfResSceneColor=0

[PostProcessQuality@0]
r.MotionBlurQuality=0
r.FastBlurThreshold=0
r.EyeAdaptationQuality=1
r.DepthOfFieldQuality=0
r.RenderTargetPoolMin=350

[PostProcessQuality@1]
r.MotionBlurQuality=2
r.EyeAdaptationQuality=2
r.DepthOfFieldQuality=1

[PostProcessQuality@2]
r.MotionBlurQuality=3
r.EyeAdaptationQuality=2
r.DepthOfFieldQuality=2

[PostProcessQuality@3]
r.MotionBlurQuality=4
r.EyeAdaptationQuality=2
r.DepthOfFieldQuality=2

; Streaming pools follow docs/architecture/performance-budget.md budgets.
[TextureQuality@0]
r.Streaming.PoolSize=768
r.Streaming.MipBias=1.0
r.Streaming.LimitPoolSizeToVRAM=1
r.MaxAnisotropy=2
r.VT.MaxAnisotropy=4

[TextureQuality@1]
r.Streaming.PoolSize=1200
r.Streaming.MipBias=0.5
r.Streaming.LimitPoolSizeToVRAM=1
r.MaxAnisotropy=4
r.VT.MaxAnisotropy=8

[TextureQuality@2]
r.Streaming.PoolSize=1800
r.Streaming.MipBias=0.2
r.MaxAnisotropy=8
r.VT.MaxAnisotropy=8

[TextureQuality@3]
r.Streaming.PoolSize=2800
r.Streaming.MipBias=0.0
r.MaxAnisotropy=16
r.VT.MaxAnisotropy=16

[EffectsQuality@0]
r.TranslucencyLightingVolume.Dim=16
r.RefractionQuality=0

[EffectsQuality@1]
r.TranslucencyLightingVolume.Dim=32
r.RefractionQuality=1

[EffectsQuality@2]
r.TranslucencyLightingVolume.Dim=48
r.RefractionQuality=2

[EffectsQuality@3]
r.TranslucencyLightingVolume.Dim=64
r.RefractionQuality=2
